name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - shared/**
      - package-lock.json
      - deploy/Caddyfile
      - deploy/docker-compose.yml
      - .github/workflows/deploy-frontend.yml
      - .github/workflows/_deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    uses: ./.github/workflows/_deploy.yml
    permissions:
      contents: read
      packages: write
    with:
      service: web
      dockerfile: frontend/Dockerfile
    secrets: inherit
