name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - shared/**
      - package-lock.json
      - deploy/docker-compose.yml
      - .github/workflows/deploy-backend.yml
      - .github/workflows/_deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    uses: ./.github/workflows/_deploy.yml
    permissions:
      contents: read
      packages: write
    with:
      service: backend
      dockerfile: backend/Dockerfile
    secrets: inherit
